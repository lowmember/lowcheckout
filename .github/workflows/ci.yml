name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execução por branch/PR: pushes novos cancelam a anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  build:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instala o pnpm
        uses: pnpm/action-setup@v4

      - name: Instala o Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      # O turbo não tem cache remoto configurado; o cache do Actions cobre o local.
      - name: Restaura o cache do turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build
        run: pnpm turbo build
