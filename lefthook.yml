# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      exclude:
        - src/routeTree.gen.ts
      run: pnpm exec biome check --write --no-errors-on-unmatched --colors=off {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
